name: Build RetroLink Android 4.4 KitKat
on:
  workflow_dispatch:
  push:
    paths:
      - 'input-project.zip'
      - '.github/workflows/kitkat.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build experimental KitKat APK
        run: |
          mkdir app
          unzip -q input-project.zip -d app
          cd app
          npm install --no-audit --no-fund
          npm run build
          # Capacitor 7 calls Android 5+ CookieManager APIs unconditionally; guard them for API 19.
          python3 - <<'PYCAP'
          from pathlib import Path
          p = Path('node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/cordova/CapacitorCordovaCookieManager.java')
          s = p.read_text()
          s = s.replace('        cookieManager.setAcceptThirdPartyCookies(webView, true);', '        if (android.os.Build.VERSION.SDK_INT >= 21) {\n            cookieManager.setAcceptThirdPartyCookies(webView, true);\n        }')
          s = s.replace('        cookieManager.removeAllCookies(null);', '        if (android.os.Build.VERSION.SDK_INT >= 21) {\n            cookieManager.removeAllCookies(null);\n        } else {\n            cookieManager.removeAllCookie();\n        }')
          s = s.replace('        cookieManager.flush();', '        if (android.os.Build.VERSION.SDK_INT >= 21) {\n            cookieManager.flush();\n        }')
          p.write_text(s)
          PYCAP
          # Guard the Capacitor Cookies plugin's additional API-21-only calls as well.
          python3 - <<'PYCOOKIES'
          from pathlib import Path
          p = Path('node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/plugin/CapacitorCookieManager.java')
          s = p.read_text()
          s = s.replace('        this.webkitCookieManager.removeSessionCookies(null);', '        if (android.os.Build.VERSION.SDK_INT >= 21) {\n            this.webkitCookieManager.removeSessionCookies(null);\n        } else {\n            this.webkitCookieManager.removeSessionCookie();\n        }')
          s = s.replace('        webkitCookieManager.removeAllCookies(null);\n        flush();', '        if (android.os.Build.VERSION.SDK_INT >= 21) {\n            webkitCookieManager.removeAllCookies(null);\n        } else {\n            webkitCookieManager.removeAllCookie();\n        }\n        flush();')
          s = s.replace('        webkitCookieManager.flush();', '        if (android.os.Build.VERSION.SDK_INT >= 21) {\n            webkitCookieManager.flush();\n        }')
          p.write_text(s)
          PYCOOKIES
          # Capacitor 7 only intercepts WebViewResourceRequests (API 21+). KitKat needs
          # the legacy String overload to serve the bundled HTML/JS/CSS from assets.
          python3 - <<'PYLEGACY'
          from pathlib import Path
          client = Path('node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/BridgeWebViewClient.java')
          s = client.read_text()
          marker = '    @Override\n    public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {'
          addition = '''    @Deprecated
    @Override
    public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
        return bridge.getLocalServer().shouldInterceptRequest(url);
    }

'''
          if addition.strip() not in s:
              if marker not in s:
                  raise SystemExit('BridgeWebViewClient interception method was not found')
              s = s.replace(marker, addition + marker, 1)
          client.write_text(s)

          local_server = Path('node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/WebViewLocalServer.java')
          s = local_server.read_text()
          marker = '    public WebResourceResponse shouldInterceptRequest(WebResourceRequest request) {'
          addition = '''    /** KitKat-compatible asset interception for WebViewClient.shouldInterceptRequest(WebView, String). */
    public WebResourceResponse shouldInterceptRequest(String url) {
        Uri loadingUrl = Uri.parse(url);
        PathHandler handler;
        synchronized (uriMatcher) {
            handler = (PathHandler) uriMatcher.match(loadingUrl);
        }
        if (handler == null) return null;

        String path = loadingUrl.getPath();
        if (path == null) return null;
        if (path.equals("/cordova.js")) {
            return new WebResourceResponse("application/javascript", handler.getEncoding(), null);
        }

        InputStream responseStream;
        String mimeType;
        if (path.equals("/")) {
            try {
                String startPath = this.basePath + "/index.html";
                if (bridge.getRouteProcessor() != null) {
                    ProcessedRoute processedRoute = bridge.getRouteProcessor().process(this.basePath, "/index.html");
                    startPath = processedRoute.getPath();
                    isAsset = processedRoute.isAsset();
                }
                responseStream = isAsset ? protocolHandler.openAsset(startPath) : protocolHandler.openFile(startPath);
                if (jsInjector != null) responseStream = jsInjector.getInjectedStream(responseStream);
            } catch (IOException e) {
                Logger.error("Unable to open index.html on legacy WebView", e);
                return null;
            }
            mimeType = "text/html";
        } else {
            responseStream = handler.handle(loadingUrl);
            mimeType = getMimeType(path, responseStream);
        }
        if (responseStream == null) return null;
        return new WebResourceResponse(mimeType, handler.getEncoding(), responseStream);
    }

'''
          if addition.strip() not in s:
              if marker not in s:
                  raise SystemExit('WebViewLocalServer interception method was not found')
              s = s.replace(marker, addition + marker, 1)
          local_server.write_text(s)
          PYLEGACY
          npx cap add android
          cd android
          # Android 4.4 cannot inflate AndroidX compatibility splash XML/vector resources.
          # Disable the compatibility splash theme only for this experimental KitKat build.
          python3 - <<'PYSTYLE'
          from pathlib import Path
          p = Path('app/src/main/res/values/styles.xml')
          if not p.exists():
              raise SystemExit('Capacitor launch styles.xml not found')
          s = p.read_text().replace('parent="Theme.SplashScreen"', 'parent="AppTheme.NoActionBar"')
          p.write_text(s)
          PYSTYLE
          grep -n -A4 'NoActionBarLaunch' app/src/main/res/values/styles.xml
          # No Cordova plugins are used by this app; omit the generated Cordova bridge
          # whose current framework requires Android 5.1 (API 22).
          grep -RIl 'capacitor-cordova-android-plugins' . --include='*.gradle' --include='*.gradle.kts' | xargs -r sed -i '/capacitor-cordova-android-plugins/d'
          # Remove unused Cordova module references and ensure every local flatDir has real paths.
          sed -i "s#'../capacitor-cordova-android-plugins/src/main/libs', ##" app/build.gradle
          mkdir -p app/libs app/src/main/libs app/node_modules/@capacitor/android/capacitor/libs
          python3 - <<'PYGRADLE'
          from pathlib import Path
          import re
          gradle = Path('app/build.gradle')
          text = gradle.read_text()
          text = re.sub(r'flatDir\s*\{\s*\}', "flatDir { dirs 'libs', 'src/main/libs' }", text)
          gradle.write_text(text)
          PYGRADLE
          grep -RIn 'cordova' app/build.gradle settings.gradle || true
          grep -n -A3 -B2 'flatDir' app/build.gradle || true
          echo '--- SDK versions before override ---'
          grep -RIn 'minSdkVersion' variables.gradle app/build.gradle
          sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 19/' variables.gradle
          sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 19/g' app/build.gradle
          echo '--- SDK versions after override ---'
          grep -RIn 'minSdkVersion' variables.gradle app/build.gradle
          python3 - <<'PYMANIFEST'
          from pathlib import Path
          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'xmlns:tools=' not in text:
              text = text.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if 'tools:overrideLibrary=' not in text:
              text = text.replace('<application', '<uses-sdk tools:overrideLibrary="org.apache.cordova,org.apache.cordova.framework,androidx.appcompat,androidx.appcompat.resources,androidx.core,androidx.core.ktx,androidx.core.splashscreen,androidx.fragment,androidx.activity,androidx.lifecycle,androidx.webkit,androidx.savedstate,androidx.annotation,androidx.collection,androidx.customview,androidx.drawerlayout,androidx.viewpager,androidx.viewpager2,androidx.documentfile,androidx.localbroadcastmanager,androidx.print,androidx.transition,androidx.vectordrawable,androidx.versionedparcelable,androidx.arch.core,androidx.startup,androidx.tracing,androidx.profileinstaller,androidx.window,androidx.recyclerview,androidx.cardview,androidx.cursoradapter,androidx.interpolator,androidx.legacy.coreui,androidx.legacy.coreutils,androidx.swiperefreshlayout,androidx.loader,androidx.media,androidx.navigation,androidx.preference,androidx.sqlite,androidx.room,androidx.work,androidx.security.crypto" />\n    <application', 1)
          manifest.write_text(text)
          PYMANIFEST
          echo '--- manifest override ---'
          grep -nE 'manifest|uses-sdk|overrideLibrary|application' app/src/main/AndroidManifest.xml
          set +e
          ./gradlew assembleDebug --stacktrace --info > ../kitkat-gradle.log 2>&1
          build_status=$?
          tail -n 160 ../kitkat-gradle.log
          exit $build_status
      - name: Test launch on Android 4.4 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 19
          target: default
          arch: x86
          profile: Nexus 5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel tcg
          disable-linux-hw-accel: true
          emulator-boot-timeout: 900
          script: |
            adb install -r app/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.retrolink.arcade || true
            adb logcat -c
            adb shell monkey -p com.retrolink.arcade 1
            sleep 15
            adb logcat -d -s AndroidRuntime:E > kitkat-launch.log
            adb shell dumpsys activity > kitkat-activity.txt
            if grep -q 'FATAL EXCEPTION' kitkat-launch.log; then cat kitkat-launch.log; exit 1; fi
            if ! grep -q 'com.retrolink.arcade' kitkat-activity.txt; then cat kitkat-activity.txt; exit 1; fi
      - name: Publish experimental KitKat APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          cp app/android/app/build/outputs/apk/debug/app-debug.apk output/RetroLink-Arcade-KitKat-experimental.apk
          gh release create android-kitkat-build-${{ github.run_number }} output/RetroLink-Arcade-KitKat-experimental.apk --title 'RetroLink Android 4.4 KitKat experimental build ${{ github.run_number }}' --notes 'Experimental minSdk 19 build attempt. Build success does not guarantee compatibility with Android 4.4 WebView or current Firebase/emulator dependencies; device testing required.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RetroLink-Arcade-KitKat-diagnostics
          path: |
            app/kitkat-gradle.log
            kitkat-launch.log
            kitkat-activity.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RetroLink-Arcade-KitKat-experimental
          path: output/RetroLink-Arcade-KitKat-experimental.apk
