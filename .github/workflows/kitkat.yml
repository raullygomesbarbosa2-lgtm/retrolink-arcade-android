name: Build RetroLink Android 4.4 KitKat
on:
  workflow_dispatch:
  push:
    paths:
      - 'input-project.zip'
      - '.github/workflows/kitkat.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build experimental KitKat APK
        run: |
          mkdir app
          unzip -q input-project.zip -d app
          cd app
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          cd android
          # No Cordova plugins are used by this app; omit the generated Cordova bridge
          # whose current framework requires Android 5.1 (API 22).
          sed -i '/capacitor-cordova-android-plugins/d' settings.gradle
          # This project has no Cordova plugins; remove the generated app dependency only.
          sed -i "/implementation project(':capacitor-cordova-android-plugins')/d" app/build.gradle
          # Preserve the app's local AAR repository while dropping Cordova's libs path.
          sed -i "s#'../capacitor-cordova-android-plugins/src/main/libs', ##" app/build.gradle
          grep -n -A3 -B2 'flatDir' app/build.gradle || true
          echo '--- SDK versions before override ---'
          grep -RIn 'minSdkVersion' variables.gradle app/build.gradle
          sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 19/' variables.gradle
          sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 19/g' app/build.gradle
          echo '--- SDK versions after override ---'
          grep -RIn 'minSdkVersion' variables.gradle app/build.gradle
          python3 - <<'PYMANIFEST'
          from pathlib import Path
          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'xmlns:tools=' not in text:
              text = text.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if 'tools:overrideLibrary=' not in text:
              text = text.replace('<application', '<uses-sdk tools:overrideLibrary="org.apache.cordova.framework,androidx.appcompat,androidx.appcompat.resources,androidx.core,androidx.core.ktx,androidx.core.splashscreen,androidx.fragment,androidx.activity,androidx.lifecycle,androidx.webkit,androidx.savedstate,androidx.annotation,androidx.collection,androidx.customview,androidx.drawerlayout,androidx.viewpager,androidx.viewpager2,androidx.documentfile,androidx.localbroadcastmanager,androidx.print,androidx.transition,androidx.vectordrawable,androidx.versionedparcelable,androidx.arch.core,androidx.startup,androidx.tracing,androidx.profileinstaller,androidx.window,androidx.recyclerview,androidx.cardview,androidx.cursoradapter,androidx.interpolator,androidx.legacy.coreui,androidx.legacy.coreutils,androidx.swiperefreshlayout,androidx.loader,androidx.media,androidx.navigation,androidx.preference,androidx.sqlite,androidx.room,androidx.work,androidx.security.crypto" />\n    <application', 1)
          manifest.write_text(text)
          PYMANIFEST
          echo '--- manifest override ---'
          grep -nE 'manifest|uses-sdk|overrideLibrary|application' app/src/main/AndroidManifest.xml
          set +e
          ./gradlew assembleDebug --stacktrace --info > ../kitkat-gradle.log 2>&1
          build_status=$?
          tail -n 160 ../kitkat-gradle.log
          exit $build_status
      - name: Publish experimental KitKat APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          cp app/android/app/build/outputs/apk/debug/app-debug.apk output/RetroLink-Arcade-KitKat-experimental.apk
          gh release create android-kitkat-build-${{ github.run_number }} output/RetroLink-Arcade-KitKat-experimental.apk --title 'RetroLink Android 4.4 KitKat experimental build ${{ github.run_number }}' --notes 'Experimental minSdk 19 build attempt. Build success does not guarantee compatibility with Android 4.4 WebView or current Firebase/emulator dependencies; device testing required.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RetroLink-Arcade-KitKat-diagnostics
          path: app/kitkat-gradle.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RetroLink-Arcade-KitKat-experimental
          path: output/RetroLink-Arcade-KitKat-experimental.apk
