name: Build RetroLink Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'input-project.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Extract project and install dependencies
        run: |
          mkdir app
          unzip -q input-project.zip -d app
          cd app
          npm install --no-audit --no-fund
          VITE_NETPLAY_URL=${{ vars.VITE_NETPLAY_URL }} npm run build
          npx cap add android
          cd android
          ./gradlew assembleDebug
      - name: Test on Android 6.0 Marshmallow emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: default
          arch: x86
          profile: Nexus 5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          script: |
            mkdir -p output
            adb install -r app/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.retrolink.arcade || true
            adb logcat -c
            adb shell monkey -p com.retrolink.arcade 1
            sleep 25
            adb logcat -d > output/marshmallow-logcat.txt
            adb shell uiautomator dump /sdcard/retrolink-window.xml >/dev/null
            adb pull /sdcard/retrolink-window.xml output/marshmallow-window.xml
            adb exec-out screencap -p > output/marshmallow-screen.png
            if grep -q 'FATAL EXCEPTION' output/marshmallow-logcat.txt; then grep -A30 'FATAL EXCEPTION' output/marshmallow-logcat.txt; exit 1; fi
            if ! grep -qiE 'RetroLink|Minhas ROMs|Selecione.*ROM|Seus Jogos' output/marshmallow-window.xml; then cat output/marshmallow-window.xml; exit 1; fi
      - name: Upload Marshmallow test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-Marshmallow-test-evidence
          path: |
            output/marshmallow-logcat.txt
            output/marshmallow-window.xml
            output/marshmallow-screen.png
          if-no-files-found: ignore
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          cp app/android/app/build/outputs/apk/debug/app-debug.apk output/RetroLink-Arcade.apk
          gh release create android-build-${{ github.run_number }} output/RetroLink-Arcade.apk --title 'RetroLink Arcade Android build ${{ github.run_number }}' --notes 'APK compilado e testado em emulador Android 6.0 Marshmallow. Recursos que precisam de backend remoto permanecem dependentes da configuração do serviço.'
      - uses: actions/upload-artifact@v4
        with:
          name: RetroLink-Arcade-APK
          path: output/RetroLink-Arcade.apk
