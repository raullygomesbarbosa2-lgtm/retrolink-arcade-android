name: Build RetroLink Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'input-project.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Extract project and install dependencies
        run: |
          mkdir app
          unzip -q input-project.zip -d app
          cd app
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          cd android
          ./gradlew assembleDebug
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          cp app/android/app/build/outputs/apk/debug/app-debug.apk output/RetroLink-Arcade.apk
          gh release create android-build-${{ github.run_number }} output/RetroLink-Arcade.apk --title 'RetroLink Arcade Android build ${{ github.run_number }}' --notes 'APK Android compilado em CI. Recursos que precisam de backend remoto permanecem dependentes da configuração do serviço.'
      - uses: actions/upload-artifact@v4
        with:
          name: RetroLink-Arcade-APK
          path: output/RetroLink-Arcade.apk
