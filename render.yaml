services:
  - type: web
    name: retrolink-arcade-relay
    runtime: node
    plan: free
    buildCommand: mkdir -p app && unzip -oq input-project.zip -d app && cd app && npm install --no-audit --no-fund && npm run build
    startCommand: cd app && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
